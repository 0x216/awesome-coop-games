name: Update list

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Allow a change bigger than the 30% guard (check the data first)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate from imho.run data
        env:
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python generate.py $FORCE_FLAG

      - name: Check the output
        run: python generate.py --check

      - name: Commit if the list changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/list.json taglines.json
          git commit -m "data: weekly regen"
          git push
